<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Notes App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
    .input-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
    textarea { height: 120px; resize: vertical; }
    button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .entry { background: #f8f9fa; padding: 15px; margin: 10px 0; border-left: 4px solid #007bff; border-radius: 4px; }
    .entry strong { color: #495057; }
    .entry small { color: #6c757d; }
    .entries { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>My Notes App</h1>
  
  <div class="input-section">
    <input id="name" placeholder="Your name" />
    <textarea id="note" placeholder="Write your note here..."></textarea>
    <button onclick="saveNote()">Save Note</button>
  </div>

  <div id="entries" class="entries">
    <h3>Saved Notes:</h3>
  </div>

  <script>
    // Load saved entries on page load
    window.onload = function() {
      loadEntries();
    };

    function saveNote() {
      const name = document.getElementById('name').value.trim();
      const note = document.getElementById('note').value.trim();

      if (!name || !note) {
        alert('Please fill name and note');
        return;
      }

      // Create new entry
      const entry = {
        name: name,
        note: note,
        timestamp: new Date().toLocaleString('en-IN', { 
          timeZone: 'Asia/Kolkata', 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric', 
          hour: '2-digit', 
          minute: '2-digit'
        })
      };

      // Load existing entries
      let entries = JSON.parse(localStorage.getItem('notes')) || [];
      entries.unshift(entry);  // Add to beginning
      localStorage.setItem('notes', JSON.stringify(entries));

      // Clear form
      document.getElementById('name').value = '';
      document.getElementById('note').value = '';

      // Refresh display
      loadEntries();
    }

    function loadEntries() {
      const entriesDiv = document.getElementById('entries');
      let entries = JSON.parse(localStorage.getItem('notes')) || [];

      if (entries.length === 0) {
        entriesDiv.innerHTML = '<h3>Saved Notes:</h3><p>No notes yet. Add one above!</p>';
        return;
      }

      let html = '<h3>Saved Notes:</h3>';
      entries.forEach(entry => {
        html += `
          <div class="entry">
            <strong>${entry.name}</strong> <small>${entry.timestamp}</small><br>
            ${entry.note}
          </div>
        `;
      });
      entriesDiv.innerHTML = html;
    }
  </script>
</body>
</html>
